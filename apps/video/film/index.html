<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hunch — showreel</title>
<style>
@font-face { font-family: 'Inter'; font-weight: 400; src: url(/fonts/inter-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 500; src: url(/fonts/inter-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 600; src: url(/fonts/inter-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 700; src: url(/fonts/inter-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: 'Geist Mono'; font-weight: 400; src: url(/fonts/geist-mono-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Geist Mono'; font-weight: 500; src: url(/fonts/geist-mono-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'Geist Mono'; font-weight: 700; src: url(/fonts/geist-mono-latin-700-normal.woff2) format('woff2'); }

:root {
  --paper: #f7f7f7; --ink: #141416; --card: #ffffff; --muted: #efeff1; --line: #e2e3e6;
  --ink2: #55575d; --ink3: #8e9097; --dcard: #1d1e22; --dline: #2c2d33; --dfg: #ececef; --dink2: #b4b6bc; --dink3: #7d8088;
  --hit: #2f8a5b; --hit-d: #5fd39a; --miss: #c4483e; --miss-d: #ff7a6e; --sui: #4da2ff; --teal: #7ce8d6;
  --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #000; }
body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); color: var(--ink); }
.scene { position: absolute; inset: 0; overflow: hidden; }
.scene.paper { background: var(--paper); color: var(--ink); }
.scene.ink { background: var(--ink); color: var(--dfg); }
.cam { position: absolute; inset: 0; transform-origin: 50% 50%; transform-style: preserve-3d; }
.c { position: absolute; left: 0; top: 0; will-change: transform, opacity; white-space: nowrap; }
.ascii { position: absolute; left: 0; top: 0; }
.overlay { z-index: 70; pointer-events: none; }
.flash { position: absolute; inset: 0; z-index: 72; pointer-events: none; }
.black { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #000; opacity: 0; }
.mono { font-family: var(--mono); }
.muted { color: var(--ink3); }
.hit { color: var(--hit); }
.miss { color: var(--miss); }
.ink .muted { color: var(--dink3); }
.ink .hit { color: var(--hit-d); }
.ink .miss { color: var(--miss-d); }

.hud { position: absolute; inset: 0; z-index: 80; pointer-events: none; font-family: var(--mono); font-size: 15px; letter-spacing: .08em; color: #55575d; }
.hud.on-ink { color: #7d8088; }
.hud .tl, .hud .tr, .hud .bl, .hud .br { position: absolute; }
.hud .tl { left: 64px; top: 40px; }
.hud .tr { right: 64px; top: 40px; }
.hud .bl { left: 64px; bottom: 36px; }
.hud .br { right: 64px; bottom: 36px; }
.hud i { position: absolute; width: 18px; height: 18px; border-color: currentColor; border-style: solid; opacity: .7; }
.hud .k1 { left: 32px; top: 30px; border-width: 1.5px 0 0 1.5px; }
.hud .k2 { right: 32px; top: 30px; border-width: 1.5px 1.5px 0 0; }
.hud .k3 { left: 32px; bottom: 30px; border-width: 0 0 1.5px 1.5px; }
.hud .k4 { right: 32px; bottom: 30px; border-width: 0 1.5px 1.5px 0; }

.hero { font-size: 76px; font-weight: 500; letter-spacing: -0.02em; }
.cur { display: inline-block; width: .55em; height: 1em; background: currentColor; vertical-align: -0.12em; margin-left: .08em; }
.cur.off { opacity: 0; }
.quote { font-size: 27px; color: var(--dink3); }
.headline { font-size: 104px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
.headline.xl { font-size: 140px; }
.headline.md { font-size: 72px; }
.tagline { font-size: 56px; font-weight: 500; letter-spacing: -0.02em; }
.label { font-size: 22px; color: var(--ink3); letter-spacing: .02em; }
.ink .label { color: var(--dink3); }
.small { font-size: 20px; color: var(--ink3); }
.ink .small { color: var(--dink3); }
.chip { font-family: var(--mono); font-size: 210px; font-weight: 500; background: var(--dfg); color: var(--ink); padding: 0 .3em .06em; border-radius: .06em; line-height: 1.1; }
.paper .chip { background: var(--ink); color: var(--paper); }
.grid { font-size: 44px; line-height: 1; letter-spacing: .1em; color: var(--ink); }
.grid .loss { color: var(--miss); }
.number { font-size: 168px; font-weight: 600; letter-spacing: -0.045em; line-height: 1; }
.number .unit { font-size: .4em; color: var(--ink3); margin-left: .08em; letter-spacing: 0; }
.number.md { font-size: 96px; }
.number.xl { font-size: 92px; }
.number.teal { color: var(--teal); }
.xl-call { font-weight: 500; font-size: .5em; letter-spacing: -0.01em; }
.sparkline { font-size: 30px; letter-spacing: -.02em; color: var(--ink2); }
.meter { font-size: 22px; color: var(--ink); letter-spacing: -.04em; }
.table { font-size: 30px; line-height: 1.75; white-space: pre; color: var(--dink2); padding: 30px 40px; border: 1px solid var(--dline); border-radius: 18px; background: rgba(29,30,34,.6); transform-origin: 50% 50%; }
.thead { color: var(--dink3); border-bottom: 1px solid var(--dline); margin-bottom: 6px; }
.hot { color: var(--hit-d); }
.nav { font-size: 22px; display: flex; gap: 26px; color: var(--ink3); }
.nav .on { background: var(--ink); color: var(--paper); padding: 1px 7px; }
.prompt { width: 1400px; font-size: 44px; line-height: 1.32; letter-spacing: -0.012em; white-space: normal; padding-right: 100px; }
.ph { color: var(--ink3); }
.send { width: 64px; height: 64px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-size: 34px; font-weight: 600; }
.steps-head { font-size: 34px; font-weight: 600; }
.steps-head .muted { font-family: var(--mono); font-size: 24px; font-weight: 400; }
.step { font-size: 26px; color: var(--ink3); }
.step.strong { color: var(--ink); font-weight: 600; }
.card { background: var(--muted); border-radius: 18px; padding: 30px 34px; font-size: 22px; line-height: 1.7; white-space: pre; color: var(--ink); }
.lab { color: var(--ink3); }
.cell { font-size: 34px; line-height: 1; color: var(--dfg); letter-spacing: -.06em; }
.cell.wrong { color: var(--dink3); }
.verdict { font-size: 30px; color: var(--hit-d); }
.node { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 26px; font-size: 23px; line-height: 1.55; min-width: 300px; box-shadow: 0 24px 50px -30px rgba(0,0,0,.35); }
.nt { font-size: 16px; color: var(--ink3); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 6px; }
.arrow { font-size: 26px; color: var(--ink2); }
.suilabel { font-size: 22px; color: var(--sui); letter-spacing: .1em; text-transform: uppercase; }
.tatum { font-size: 18px; color: var(--ink3); }
.txline { font-size: 28px; color: var(--sui); }
.backline { font-size: 28px; color: var(--hit); }
.request { font-size: 36px; color: var(--dink2); }
.stamp { font-size: 128px; font-weight: 700; color: var(--miss-d); border: 9px solid var(--miss-d); border-radius: 20px; padding: 6px 42px 16px; letter-spacing: -0.02em; }
.pickline { font-size: 34px; }
.check { font-size: 24px; color: var(--dfg); }
.memlog { position: absolute; left: 0; top: 0; }
.memline { position: absolute; left: 0; top: 0; font-family: var(--mono); font-size: 18px; line-height: 1.5; white-space: pre; color: var(--dfg); }
.blob { font-size: 16px; color: var(--hit-d); }
.scores { font-size: 30px; line-height: 1.9; white-space: pre; color: var(--dink2); }
.best { color: var(--dfg); font-weight: 700; }
.readout { font-size: 20px; color: var(--ink2); background: var(--card); border: 1px solid var(--line); padding: 6px 12px; border-radius: 10px; }
.summary { font-size: 24px; color: var(--ink); }
.cite { text-align: left; }
.say { font-size: 46px; font-weight: 600; letter-spacing: -0.02em; }
.blobline { font-size: 22px; color: var(--hit); margin-top: 10px; }
.url { font-size: 36px; color: var(--dfg); }
.wall { position: absolute; left: 0; top: 0; width: 2740px; height: 1240px; transform-style: preserve-3d; }
.frame { position: absolute; left: 0; top: 0; width: 860px; border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 50px 90px -40px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.06); }
.fbar { height: 34px; background: #ececee; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #d3d4d8; display: block; }
.view { height: 540px; overflow: hidden; background: #f7f7f7; }
.view img { display: block; }
.tile { width: 540px; height: 250px; border-radius: 22px; padding: 30px 34px; background: var(--ink); color: var(--dfg); white-space: normal; }
.tile b { display: block; font-size: 96px; font-weight: 600; letter-spacing: -0.045em; line-height: 1; }
.tile span { display: block; font-size: 25px; color: var(--dink2); margin-top: 14px; font-weight: 500; }
.tile em { display: block; font-style: normal; font-family: var(--mono); font-size: 17px; color: var(--dink3); margin-top: 8px; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="/film.js"></script>
</body>
</html>
