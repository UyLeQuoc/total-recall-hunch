name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here touches mainnet. Tests that read a real Walrus Memory account skip themselves when
# credentials are absent.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Lint and format
        run: bun run lint

      - name: Docs links resolve
        run: bun scripts/check-links.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Audit dependencies
        run: bun pm scan

      - name: No secrets tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -vq '\.env\.example$'; then
            echo "::error::an .env file is tracked"; exit 1
          fi
          if git ls-files | grep -Eq '(^|/)\.turbo/'; then
            echo "::error::turbo cache is tracked"; exit 1
          fi
          echo "clean"

  move:
    runs-on: ubuntu-latest
    env:
      SUI_VERSION: testnet-v1.82.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Sui CLI
        if: hashFiles('packages/move/hunch/Move.toml') != ''
        run: |
          mkdir -p /tmp/sui-cli "$HOME/.local/bin"
          curl -fsSL "https://github.com/MystenLabs/sui/releases/download/${SUI_VERSION}/sui-${SUI_VERSION}-ubuntu-x86_64.tgz" | tar -xz -C /tmp/sui-cli
          install -m 0755 "$(find /tmp/sui-cli -type f -name sui | head -1)" "$HOME/.local/bin/sui"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: sui move test
        run: |
          if [ ! -f packages/move/hunch/Move.toml ]; then
            echo "packages/move/hunch has no Move package yet; skipping."
            exit 0
          fi
          (cd packages/move/hunch && sui move test)
